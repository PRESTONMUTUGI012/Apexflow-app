<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexflow Markets - Dollar Hunters Terminal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentBlue: '#2563eb',
                        accentGreen: '#16a34a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-cardBg border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wider text-blue-500">APEXFLOW MARKETS</span>
            <span class="text-xs bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30">Dollar Hunters</span>
        </div>
        
        <div class="flex items-center space-x-6">
            <div id="connection-status" class="flex items-center space-x-2 text-xs">
                <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse" id="status-dot"></span>
                <span id="status-text" class="text-slate-400">Connecting...</span>
            </div>

            <!-- OAuth Login / Account Status Section -->
            <div id="auth-container" class="flex items-center space-x-3">
                <button id="login-btn" onclick="redirectToDerivOAuth()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-xs font-semibold transition shadow-md">
                    Connect Deriv Account
                </button>
                <div id="user-info" class="hidden flex items-center space-x-3 text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <div>
                        <span class="text-slate-400">Acct:</span>
                        <span id="account-id" class="font-mono text-green-400 font-bold"></span>
                    </div>
                    <div class="border-l border-slate-700 pl-3">
                        <span class="text-slate-400">Bal:</span>
                        <span id="account-balance" class="font-mono text-slate-200 font-bold">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar: Market Categories -->
        <aside class="w-64 bg-cardBg border-r border-slate-700 p-4 flex flex-col space-y-2">
            <h3 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Market Categories</h3>
            <button onclick="switchMarket('synthetics', event)" class="market-btn w-full text-left px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium transition">Synthetic Indices</button>
            <button onclick="switchMarket('forex', event)" class="market-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-700 text-slate-300 transition">Forex Majors</button>
            <button onclick="switchMarket('indices', event)" class="market-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-700 text-slate-300 transition">Stock Indices</button>
            <button onclick="switchMarket('crypto', event)" class="market-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-700 text-slate-300 transition">Cryptocurrencies</button>
            <button onclick="switchMarket('commodities', event)" class="market-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-700 text-slate-300 transition">Commodities</button>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 overflow-y-auto flex flex-col justify-between">
            <div>
                <div class="mb-6 flex justify-between items-end">
                    <div>
                        <h1 id="current-category-title" class="text-2xl font-bold">Synthetic Indices</h1>
                        <p class="text-sm text-slate-400">Track live market feeds and deploy binary trades instantly.</p>
                    </div>
                </div>

                <!-- Asset Grid Container -->
                <div id="assets-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards will be populated dynamically -->
                </div>
            </div>

            <!-- Active Trade Panel / Status Banner -->
            <div id="trade-panel" class="mt-8 bg-cardBg border border-slate-700 p-4 rounded-xl hidden">
                <div class="flex justify-between items-center mb-2">
                    <h3 id="trade-panel-title" class="font-bold text-sm text-blue-400">Active Trade Setup</h3>
                    <span id="proposal-status" class="text-xs font-mono text-yellow-400">Fetching proposal...</span>
                </div>
                <div class="flex justify-between items-center">
                    <div class="text-xs text-slate-300 space-x-4">
                        <span>Stake: <strong class="text-white">$10 USD</strong></span>
                        <span>Potential Payout: <strong id="payout-val" class="text-green-450 text-green-400">$0.00</strong></span>
                    </div>
                    <div class="space-x-2">
                        <button onclick="executeBuyContract()" class="bg-green-600 hover:bg-green-500 px-6 py-2 rounded-lg text-xs font-bold transition shadow">Execute Trade</button>
                        <button onclick="closeTradePanel()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-semibold transition">Cancel</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Script -->
    <script>
        const appId = '34RmI4MDorKLlLJPcnfUC';
        const redirectUri = 'https://prestonmutugi012.github.io/Apexflow-app/';
        const ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${appId}`);

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const assetsGrid = document.getElementById('assets-grid');

        let activeCategory = 'synthetics';
        let currentProposalId = null;
        let isAuthorized = false;

        const marketGroups = {
            synthetics: [
                { symbol: 'R_10', name: 'Volatility 10 Index' },
                { symbol: 'R_25', name: 'Volatility 25 Index' },
                { symbol: 'R_50', name: 'Volatility 50 Index' },
                { symbol: 'R_75', name: 'Volatility 75 Index' },
                { symbol: 'R_100', name: 'Volatility 100 Index' },
                { symbol: 'BOOM1000', name: 'Boom 1000 Index' },
                { symbol: 'CRASH1000', name: 'Crash 1000 Index' }
            ],
            forex: [
                { symbol: 'frxEURUSD', name: 'EUR/USD' },
                { symbol: 'frxGBPUSD', name: 'GBP/USD' },
                { symbol: 'frxUSDJPY', name: 'USD/JPY' },
                { symbol: 'frxAUDUSD', name: 'AUD/USD' }
            ],
            indices: [
                { symbol: 'WN30', name: 'Wall Street 30' },
                { symbol: 'USTEC', name: 'US Tech 100' },
                { symbol: 'JP225', name: 'Japan 225' }
            ],
            crypto: [
                { symbol: 'cryBTCUSD', name: 'BTC/USD' },
                { symbol: 'cryETHUSD', name: 'ETH/USD' }
            ],
            commodities: [
                { symbol: 'frxXAUUSD', name: 'Spot Gold (XAU/USD)' },
                { symbol: 'frxXAGUSD', name: 'Spot Silver (XAG/USD)' }
            ]
        };

        // OAuth Login Flow Handlers
        function redirectToDerivOAuth() {
            window.location.href = `https://oauth.deriv.com/oauth2/authorize?app_id=${appId}&l=EN&brand=deriv`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token1 = urlParams.get('token1');
            const acct1 = urlParams.get('acct1');

            if (token1 && acct1) {
                localStorage.setItem('deriv_token', token1);
                localStorage.setItem('deriv_account', acct1);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const savedToken = localStorage.getItem('deriv_token');
            const savedAccount = localStorage.getItem('deriv_account');

            if (savedToken && savedAccount) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('account-id').innerText = savedAccount;
            }
        });

        // WebSocket Connection Events
        ws.onopen = function() {
            statusDot.classList.remove('bg-yellow-500');
            statusDot.classList.add('bg-green-500');
            statusText.innerText = 'Connected to Deriv API';
            
            loadMarketAssets(activeCategory);

            // Authorize if token exists in storage
            const savedToken = localStorage.getItem('deriv_token');
            if (savedToken) {
                ws.send(JSON.stringify({ authorize: savedToken }));
            }
        };

        ws.onclose = function() {
            statusDot.classList.remove('bg-green-500');
            statusDot.classList.add('bg-red-500');
            statusText.innerText = 'Connection Disconnected';
        };

        function switchMarket(category, event) {
            activeCategory = category;
            document.getElementById('current-category-title').innerText = category.charAt(0).toUpperCase() + category.slice(1) + ' Markets';
            
            document.querySelectorAll('.market-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('hover:bg-slate-700', 'text-slate-300');
            });
            event.target.classList.add('bg-blue-600', 'text-white');
            event.target.classList.remove('hover:bg-slate-700', 'text-slate-300');

            loadMarketAssets(category);
        }

        function loadMarketAssets(category) {
            assetsGrid.innerHTML = '';
            const assets = marketGroups[category] || [];

            assets.forEach(asset => {
                const card = document.createElement('div');
                card.className = 'bg-cardBg border border-slate-700 p-5 rounded-xl shadow-md flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold text-base text-slate-100">${asset.name}</h4>
                            <span class="text-xs font-mono text-slate-400">${asset.symbol}</span>
                        </div>
                        <div class="my-4">
                            <span id="price-${asset.symbol}" class="text-2xl font-mono font-semibold tracking-tight text-slate-100">Connecting...</span>
                        </div>
                    </div>
                    <div class="flex space-x-2 mt-4">
                        <button onclick="prepareTrade('${asset.symbol}', '${asset.name}', 'CALL')" class="flex-1 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/30 py-2 rounded-lg text-xs font-semibold transition">Rise (Call)</button>
                        <button onclick="prepareTrade('${asset.symbol}', '${asset.name}', 'PUT')" class="flex-1 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 py-2 rounded-lg text-xs font-semibold transition">Fall (Put)</button>
                    </div>
                `;
                assetsGrid.appendChild(card);
                
                // Subscribe to ticks
                ws.send(JSON.stringify({ ticks: asset.symbol }));
            });
        }

        function prepareTrade(symbol, name, contractType) {
            if (!localStorage.getItem('deriv_token')) {
                alert('Please connect your Deriv account first using the top right button.');
                return;
            }

            document.getElementById('trade-panel').classList.remove('hidden');
            document.getElementById('trade-panel-title').innerText = `Trade Setup: ${name} (${contractType === 'CALL' ? 'Rise' : 'Fall'})`;
            document.getElementById('proposal-status').innerText = 'Requesting quote...';

            // Request contract proposal (5 ticks duration, $10 stake)
            ws.send(JSON.stringify({
                proposal: 1,
                amount: 10,
                basis: 'stake',
                currency: 'USD',
                symbol: symbol,
                contract_type: contractType,
                duration: 5,
                duration_unit: 't'
            }));
        }

        function closeTradePanel() {
            document.getElementById('trade-panel').classList.add('hidden');
            currentProposalId = null;
        }

        function executeBuyContract() {
            if (!currentProposalId) {
                alert('No active trade proposal selected.');
                return;
            }

            ws.send(JSON.stringify({
                buy: currentProposalId,
                price: 10
            }));
        }

        // Handle incoming WebSocket responses
        ws.onmessage = function(msg) {
            const data = JSON.parse(msg.data);
            
            if (data.msg_type === 'tick') {
                const tick = data.tick;
                const priceElement = document.getElementById(`price-${tick.symbol}`);
                if (priceElement) {
                    priceElement.innerText = tick.quote.toFixed(tick.pip || 2);
                }
            }

            if (data.msg_type === 'authorize') {
                if (!data.error) {
                    isAuthorized = true;
                    document.getElementById('account-balance').innerText = `$${parseFloat(data.authorize.balance).toFixed(2)}`;
                } else {
                    console.error('Authorization failed:', data.error.message);
                }
            }

            if (data.msg_type === 'proposal') {
                if (data.error) {
                    document.getElementById('proposal-status').innerText = `Error: ${data.error.message}`;
                    currentProposalId = null;
                    return;
                }
                currentProposalId = data.proposal.id;
                document.getElementById('proposal-status').innerText = 'Ready to execute';
                document.getElementById('payout-val').innerText = `$${data.proposal.payout.toFixed(2)}`;
            }

            if (data.msg_type === 'buy') {
                if (data.error) {
                    alert(`Trade execution failed: ${data.error.message}`);
                    return;
                }
                alert(`Trade Successful! Contract ID: ${data.buy.contract_id}`);
                closeTradePanel();
                
                // Refresh balance after trade
                const savedToken = localStorage.getItem('deriv_token');
                if (savedToken) ws.send(JSON.stringify({ authorize: savedToken }));
            }
        };
    </script>
</body>
</html>
